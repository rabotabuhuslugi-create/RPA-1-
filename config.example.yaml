# Скопируйте в config.yaml и заполните.
folders:
  inbox: ./inbox          # сюда кладутся сканы (PDF/JPG/PNG/TIFF)
  processed: ./processed  # успешно загруженные
  errors: ./errors        # не распознаны / ошибка загрузки
  debug: ./debug          # сюда сохраняется распознанный текст каждого скана
  state: ./state          # статус, история и журнал для панели управления

ocr:
  lang: rus+eng
  tesseract_cmd: null     # напр. C:\Program Files\Tesseract-OCR\tesseract.exe
  poppler_path: null      # Windows: путь к bin Poppler для PDF
  dpi: 300

onec:
  # Включите в 1С публикацию стандартного интерфейса OData (Администрирование -> ... -> Состав OData)
  base_url: "http://server/ka/odata/standard.odata"
  user: "rpa_user"
  password_env: "ONEC_PASSWORD"   # пароль берется из переменной окружения
  verify_tls: true
  own_inn: "7700000000"   # ИНН вашей организации (исключается при поиске контрагента)
  organization_key: "00000000-0000-0000-0000-000000000000"   # GUID организации
  warehouse_key: null       # GUID склада (Склад_Key) - скопируйте из `python -m rpa1c.sample`
  department_key: null      # GUID подразделения (Подразделение_Key) - оттуда же
  currency_key: null        # GUID валюты, если ее нет в договоре (Валюта_Key)
  document_entity: "Document_ПриобретениеТоваровУслуг"
  counterparty_entity: "Catalog_Контрагенты"
  contract_entity: "Catalog_ДоговорыКонтрагентов"
  contract_owner_field: "Контрагент_Key"   # реквизит договора со ссылкой на контрагента (в КА обычно Контрагент_Key)
  attachment_entity: "Catalog_ПриобретениеТоваровУслугПрисоединенныеФайлы"  # справочник файлов именно этого документа
  attachment_data_field: "ФайлХранилище_Base64"   # зависит от конфигурации, проверьте в $metadata
  post_document: false      # false = оставить черновик для проверки человеком
  extra_document_fields: {}  # обязательные реквизиты вашей базы, если 1С их потребует, например:
  #   ВидОперации: "..."     # значение смотрите в $metadata / в тексте ошибки 1С

rpa:
  poll_seconds: 30          # 0 = один проход и выход
  min_confidence_fields: 3  # минимум найденных полей (номер, дата, ИНН, сумма)

dashboard:
  host: 127.0.0.1   # только этот компьютер; 0.0.0.0 откроет панель всей сети (нет пароля!)
  port: 8765
